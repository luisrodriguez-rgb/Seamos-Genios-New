<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada | Seamos Genios</title>
  <meta http-equiv="refresh" content="2;url=/">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/global/tokens.css">
  <link rel="stylesheet" href="css/global/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0D1117;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .error-card {
      max-width: 500px;
      padding: 3rem 2rem;
      background: #182234;
      border: 2px solid rgba(255, 30, 39, 0.4);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 900;
      color: #FF1E27;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }
    .error-desc {
      color: #94A3B8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn-home {
      display: inline-block;
      background: #FF1E27;
      color: #FFFFFF;
      text-decoration: none;
      padding: 0.85rem 2rem;
      border-radius: 9999px;
      font-weight: 800;
      box-shadow: 0 4px 18px rgba(255, 30, 39, 0.4);
      transition: transform 0.2s ease;
    }
    .btn-home:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-desc">La página que buscas no existe o fue movida. Te estamos redirigiendo al inicio...</p>
    <a href="/" class="btn-home">Volver al Inicio →</a>
  </div>
</body>
</html>
